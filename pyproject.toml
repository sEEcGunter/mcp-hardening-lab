[project]
name = "mcp-hardening-lab"
version = "0.1.0"
description = "Local educational lab for three published MCP security bug classes"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sEEcGunter" }]
# FastMCP lives in mcp 1.x. mcp 2 renamed it to MCPServer.
# The 1.30 floor is GHSA-qx49-fqc8-xw99, fixed in 1.30.0 on this line.
dependencies = ["mcp>=1.30,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette's TestClient warns until httpx2 is installed. httpx2 is not a
# dependency of this lab; tests use the in-process client Starlette ships.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
